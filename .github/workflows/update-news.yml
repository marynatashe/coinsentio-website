
name: CoinSentio News Update

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: write

concurrency:
  group: coinsentio-news-update
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Collect RSS news
        run: python scripts/update_news.py

      - name: Save news to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/news.json

          if git diff --cached --quiet; then
            echo "No new news to save"
          else
            git commit -m "Auto-update CoinSentio news"
            git push
          fi
          
      - name: Test Zhipu AI connection
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: python scripts/test_ai.py

