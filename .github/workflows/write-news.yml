
name: CoinSentio AI News Writer

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coinsentio-news-writer
  cancel-in-progress: false

jobs:
  write-news:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Generate AI news drafts
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: python scripts/write_news.py

      - name: Save drafts to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/drafts.json

          if git diff --cached --quiet; then
            echo "No new drafts"
            exit 0
          fi

          git commit -m "Generate CoinSentio AI news drafts"
          git pull --rebase origin main
          git push origin HEAD:main
